<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terra Nova | Smart Scanner MVP</title>
    <style>
        :root {
            --primary: #2D5A27;
            --white: #ffffff;
            --bg: #e8f0e8;
            --accent: #FFD700;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: var(--white);
            padding: 2rem;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        h1 { color: var(--primary); margin: 0; font-size: 1.8rem; }
        .subtitle { color: #666; font-size: 0.9rem; margin-bottom: 1.5rem; }

        #webcam-container {
            margin: 15px auto;
            width: 280px;
            height: 280px;
            border: 5px solid var(--primary);
            border-radius: 20px;
            overflow: hidden;
            background: #000;
        }

        select, .btn-main {
            width: 100%;
            padding: 14px;
            border-radius: 15px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        #camera-select { background: #fff; border: 1px solid #ccc; margin-bottom: 10px; }
        .btn-main { background: var(--accent); color: #000; font-size: 1rem; }
        .btn-main:active { transform: scale(0.98); }

        /* MODALES */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0; top: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            width: 85%;
            max-width: 380px;
            border-radius: 25px;
            overflow: hidden;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .modal-header { padding: 20px; color: white; font-size: 1.4rem; font-weight: bold; text-align: center; }
        .modal-body { padding: 25px; text-align: center; }
        
        .res-title { font-size: 1.6rem; color: #222; margin-bottom: 5px; }
        .res-caneca { display: inline-block; padding: 6px 16px; border-radius: 20px; font-weight: bold; font-size: 0.85rem; margin-bottom: 20px; }
        
        .bg-blanca { background: #f0f0f0; color: #333; border: 1px solid #ccc; }
        .bg-verde { background: #2D5A27; color: white; }
        .bg-negra { background: #333; color: white; }

        .btn-feedback {
            background: none;
            color: #888;
            text-decoration: underline;
            font-size: 0.8rem;
            margin-top: 20px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🌿 Terra Nova</h1>
        <p class="subtitle">Escáner de Residuos Inteligente</p>
        
        <select id="camera-select"></select>
        <div id="webcam-container"></div>
        <button id="btn-action" class="btn-main" onclick="handleAction()">ENCENDER CÁMARA</button>
    </div>

    <!-- VENTANA DE RESULTADOS -->
    <div id="resultModal" class="modal">
        <div class="modal-content">
            <div id="modal-header" class="modal-header">¡Análisis Listo!</div>
            <div class="modal-body">
                <div id="res-clase" class="res-title">---</div>
                <div id="res-caneca-tag" class="res-caneca">---</div>
                <p id="res-instrucciones" style="color:#555; line-height:1.4; min-height: 60px;"></p>
                
                <button class="btn-main" style="background:#eee;" onclick="closeModal()">NUEVA CAPTURA</button>
                <br>
                <button class="btn-feedback" onclick="openFeedback()">¿No es el resultado correcto?</button>
            </div>
        </div>
    </div>

    <!-- VENTANA DE RETROALIMENTACIÓN -->
    <div id="feedbackModal" class="modal">
        <div class="modal-content">
            <div class="modal-header" style="background:#444;">Reportar Error</div>
            <div class="modal-body">
                <p style="font-size: 0.9rem;">¿Qué residuo era realmente?</p>
                <select id="feedback-select" style="width:100%; padding:10px; margin-bottom:15px; border-radius:10px;">
                    <option value="Plastico">Plástico</option>
                    <option value="Papel">Papel</option>
                    <option value="Carton">Cartón</option>
                    <option value="Vidrio">Vidrio</option>
                    <option value="Metales">Metales</option>
                    <option value="Organico">Orgánico</option>
                </select>
                <button class="btn-main" onclick="submitFeedback()">ENVIAR REPORTE</button>
                <button class="btn-feedback" onclick="closeFeedback()">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <script>
        // Nuevo modelo proporcionado
        const URL_MODELO = "https://teachablemachine.withgoogle.com/models/9R7ovTOa9/"; 

        const RESIDUOS_DB = {
            "plastico": { n: "Plástico", c: "BLANCA (Aprovechables)", css: "bg-blanca", h: "#3498db", t: "Limpia y seca el envase. Retira etiquetas si es posible y aplástalo." },
            "papel": { n: "Papel", c: "BLANCA (Aprovechables)", css: "bg-blanca", h: "#3498db", t: "Debe estar seco y sin restos de comida o grasa." },
            "carton": { n: "Cartón", c: "BLANCA (Aprovechables)", css: "bg-blanca", h: "#3498db", t: "Desarma las cajas. Si tiene mucha grasa (ej. pizza), va a la negra." },
            "vidrio": { n: "Vidrio", c: "BLANCA (Aprovechables)", css: "bg-blanca", h: "#3498db", t: "Retira tapas metálicas. No recicles aquí espejos o bombillos." },
            "metales": { n: "Metales", c: "BLANCA (Aprovechables)", css: "bg-blanca", h: "#3498db", t: "Latas de aluminio y acero. Asegúrate de que estén vacías." },
            "organico": { n: "Orgánico", c: "VERDE (Composta)", css: "bg-verde", h: "#27ae60", t: "Restos de comida, cáscaras de fruta y desechos agrícolas." },
            "nada": { n: "Sin residuo", c: "N/A", css: "bg-negra", h: "#333", t: "No detecto un objeto claro. Intenta acercarlo más o mejorar la luz." },
            "aprovechables": { n: "Aprovechable", c: "BLANCA", css: "bg-blanca", h: "#3498db", t: "Este material puede ser reciclado. Asegúrate de que esté limpio." }
        };

        let model, webcam, animationId, isCameraActive = false;

        // Normalización de texto para búsqueda en DB
        function limpiarTexto(t) {
            return t.toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        }

        async function setupCameras() {
            const selector = document.getElementById('camera-select');
            const devices = await navigator.mediaDevices.enumerateDevices();
            const videoDevices = devices.filter(d => d.kind === 'videoinput');
            selector.innerHTML = videoDevices.map((d, i) => `<option value="${d.deviceId}">${d.label || 'Cámara '+(i+1)}</option>`).join('');
        }
        setupCameras();

        async function handleAction() {
            const btn = document.getElementById("btn-action");
            if (!isCameraActive) {
                btn.innerText = "CARGANDO IA...";
                model = await tmImage.load(URL_MODELO + "model.json", URL_MODELO + "metadata.json");
                
                webcam = new tmImage.Webcam(280, 280, true);
                await webcam.setup({ deviceId: document.getElementById("camera-select").value });
                await webcam.play();
                
                document.getElementById("webcam-container").appendChild(webcam.canvas);
                window.requestAnimationFrame(loop);
                isCameraActive = true;
                btn.innerText = "TOMAR FOTO / ANALIZAR";
            } else {
                predict(); // Analiza solo cuando se presiona el botón
            }
        }

        function loop() {
            webcam.update();
            animationId = window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            let highestProb = 0;
            let bestMatch = "nada";

            prediction.forEach(p => {
                if (p.probability > highestProb) {
                    highestProb = p.probability;
                    bestMatch = p.className;
                }
            });

            // Log de consola para depuración basado en image_28f71e.png
            console.log("IA Detectó:", bestMatch, "Confianza:", highestProb.toFixed(2));
            
            showResult(limpiarTexto(bestMatch), highestProb);
        }

        function showResult(clase, prob) {
            let data = RESIDUOS_DB[clase] || RESIDUOS_DB["nada"];
            
            // Si la confianza es muy baja, forzamos "Nada"
            if (prob < 0.45) data = RESIDUOS_DB["nada"];

            document.getElementById("res-clase").innerText = data.n;
            document.getElementById("res-caneca-tag").innerText = "CANECA: " + data.c;
            document.getElementById("res-caneca-tag").className = "res-caneca " + data.css;
            document.getElementById("res-instrucciones").innerHTML = data.t;
            document.getElementById("modal-header").style.background = data.h;

            document.getElementById("resultModal").style.display = "flex";
            window.cancelAnimationFrame(animationId); // Pausar video para ahorrar recursos
        }

        function closeModal() {
            document.getElementById("resultModal").style.display = "none";
            window.requestAnimationFrame(loop); // Reanudar video
        }

        function openFeedback() { document.getElementById("feedbackModal").style.display = "flex"; }
        function closeFeedback() { document.getElementById("feedbackModal").style.display = "none"; }
        
        function submitFeedback() {
            const corregido = document.getElementById("feedback-select").value;
            alert("¡Gracias! Reportamos que este objeto era " + corregido + ". Esto ayudará a entrenar nuestra IA.");
            closeFeedback();
            closeModal();
        }
    </script>
</body>
</html>
